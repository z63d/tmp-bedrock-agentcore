[project]
name = "bedrock-agentcore-app"
version = "1.0.0"
description = "Bedrock AgentCore Python Application"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.4.2",
    "strands-agents[bedrock]>=1.27.0",
    "mcp-proxy-for-aws>=1.1.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_agentcore_app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
