[project]
name = "bedrock-agentcore-app"
version = "1.0.0"
description = "Bedrock AgentCore Python Application - Phase 1 LLM-only"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.21.0",
    "strands-agents>=1.52.0",
    "strands-agents-tools>=0.8.6",
    "aws-opentelemetry-distro>=0.19.0",
    "structlog>=26.1.0",
    "mcp-proxy-for-aws>=1.6.4",
    "kubernetes>=32.0.0",
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_agentcore_app"]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
