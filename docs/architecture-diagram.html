<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SRE Agent Architecture</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  h1 { font-size: 1.2em; color: #fff; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 0.8em; margin-bottom: 16px; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>
<h1>SRE Agent Architecture</h1>
<p class="sub">Bedrock AgentCore Runtime — Pattern 3 (VPC + PrivateLink + Resource Policy)</p>

<svg viewBox="0 0 1100 750" style="width:100%; max-width:1100px; height:auto;">
<defs>
  <marker id="a-gray"   viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#64748b"/></marker>
  <marker id="a-cyan"   viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#22d3ee"/></marker>
  <marker id="a-green"  viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#4ade80"/></marker>
  <marker id="a-orange" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#fb923c"/></marker>
  <marker id="a-lime"   viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#a3e635"/></marker>
  <marker id="a-red"    viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L9,3.5 L0,7z" fill="#f87171"/></marker>
</defs>

<!-- ========== VPC boundary ========== -->
<rect x="20" y="200" width="740" height="390" rx="14" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
<text x="32" y="222" fill="#22d3ee" font-size="11" font-weight="600">AgentCore VPC (10.1.0.0/16)</text>

<!-- private subnet -->
<rect x="40" y="236" width="360" height="80" rx="8" fill="#0f2337" stroke="#1e4976" stroke-dasharray="4,3" opacity="0.6"/>
<text x="52" y="254" fill="#64748b" font-size="9">private subnet (10.1.10.0/24)</text>
<rect x="52"  y="264" width="155" height="38" rx="6" fill="#132a1a" stroke="#22c55e" stroke-width="1"/>
<text x="130" y="287" text-anchor="middle" fill="#86efac" font-size="10">Slack Bot Lambda ENI</text>
<rect x="218" y="264" width="170" height="38" rx="6" fill="#132a1a" stroke="#22c55e" stroke-width="1"/>
<text x="303" y="287" text-anchor="middle" fill="#86efac" font-size="10">AgentCore Runtime ENI</text>

<!-- VPC Endpoints -->
<rect x="40" y="330" width="250" height="38" rx="6" fill="#162032" stroke="#0ea5e9"/>
<text x="52" y="354" fill="#7dd3fc" font-size="10" font-weight="600">VPCE: bedrock-agentcore</text>
<text x="280" y="354" fill="#64748b" font-size="9" text-anchor="end">Runtime / Memory</text>

<rect x="40" y="380" width="250" height="38" rx="6" fill="#162032" stroke="#0ea5e9"/>
<text x="52" y="404" fill="#7dd3fc" font-size="10" font-weight="600">VPCE: bedrock-agentcore.gateway</text>
<text x="280" y="404" fill="#64748b" font-size="9" text-anchor="end">MCP Gateway</text>

<rect x="40" y="430" width="250" height="38" rx="6" fill="#162032" stroke="#0ea5e9"/>
<text x="52" y="454" fill="#7dd3fc" font-size="10" font-weight="600">VPCE: S3 (Gateway)</text>
<text x="280" y="454" fill="#64748b" font-size="9" text-anchor="end">ECR pull 等</text>

<!-- NAT Gateway -->
<rect x="40" y="484" width="250" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
<text x="165" y="506" text-anchor="middle" fill="#94a3b8" font-size="10">NAT Gateway → Internet</text>

<!-- Resource Policy -->
<rect x="420" y="236" width="320" height="95" rx="8" fill="#1a1220" stroke="#a855f7"/>
<text x="434" y="258" fill="#c084fc" font-size="12" font-weight="700">Resource Policy</text>
<text x="434" y="276" fill="#4ade80" font-size="10">Allow: Slack Bot Lambda Role のみ</text>
<text x="434" y="294" fill="#f87171" font-size="10">Deny: aws:SourceVpc ≠ VPC ID → 全拒否</text>
<text x="434" y="312" fill="#94a3b8" font-size="9">= VPC 外からは IAM 権限があっても到達不可</text>

<!-- VPC Peering -->
<rect x="420" y="350" width="320" height="40" rx="6" fill="#132a1a" stroke="#a3e635"/>
<text x="580" y="375" text-anchor="middle" fill="#a3e635" font-size="11" font-weight="600">VPC Peering → Product VPC</text>

<!-- ========== External: above VPC ========== -->

<!-- User -->
<rect x="30" y="20" width="120" height="40" rx="8" fill="#1e293b" stroke="#475569"/>
<text x="90" y="45" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">User (Slack)</text>

<!-- Slack Bot Lambda -->
<rect x="30" y="100" width="200" height="60" rx="8" fill="#1e1b3a" stroke="#6366f1"/>
<text x="130" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Slack Bot Lambda</text>
<text x="130" y="140" text-anchor="middle" fill="#94a3b8" font-size="9">AWS マネージド / ENI で VPC 接続</text>

<!-- AgentCore Runtime -->
<rect x="380" y="80" width="280" height="90" rx="8" fill="#1e1b3a" stroke="#6366f1"/>
<text x="520" y="102" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">AgentCore Runtime</text>
<text x="520" y="118" text-anchor="middle" fill="#94a3b8" font-size="9">AWS microVM / ENI で VPC 接続</text>
<text x="400" y="138" fill="#e2e8f0" font-size="10"><tspan font-weight="700">Orchestrator</tspan> (per-request)</text>
<text x="410" y="154" fill="#e2e8f0" font-size="10">└ <tspan font-weight="700">Investigation Agent</tspan> (singleton)</text>

<!-- Memory -->
<rect x="780" y="20" width="200" height="60" rx="8" fill="#1a2332" stroke="#3b82f6"/>
<text x="880" y="42" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">AgentCore Memory</text>
<text x="880" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">SEMANTIC | STM (Events) + LTM (Records)</text>

<!-- Internet (denied) -->
<rect x="780" y="110" width="140" height="50" rx="8" fill="#2a1015" stroke="#ef4444"/>
<text x="850" y="134" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">Internet</text>
<text x="850" y="150" text-anchor="middle" fill="#f87171" font-size="9">public endpoint blocked</text>

<!-- Gateway -->
<rect x="420" y="510" width="320" height="55" rx="8" fill="#1a2332" stroke="#3b82f6"/>
<text x="580" y="533" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">AgentCore Gateway (MCP)</text>
<text x="580" y="550" text-anchor="middle" fill="#94a3b8" font-size="9">IAM 認証 (SigV4) | Credential Provider</text>

<!-- Product VPC -->
<rect x="830" y="330" width="200" height="65" rx="8" fill="#1a2016" stroke="#84cc16"/>
<text x="930" y="353" text-anchor="middle" fill="#a3e635" font-size="12" font-weight="700">Product VPC</text>
<text x="930" y="370" text-anchor="middle" fill="#e2e8f0" font-size="10">EKS (read-only)</text>
<text x="930" y="385" text-anchor="middle" fill="#e2e8f0" font-size="10">RDS MySQL (read-only)</text>

<!-- MCP Targets -->
<rect x="380" y="620" width="130" height="45" rx="8" fill="#27181a" stroke="#f97316"/>
<text x="445" y="643" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">Rollbar MCP</text>
<text x="445" y="657" text-anchor="middle" fill="#94a3b8" font-size="9">Lambda</text>

<rect x="530" y="620" width="130" height="45" rx="8" fill="#27181a" stroke="#f97316"/>
<text x="595" y="643" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">New Relic MCP</text>
<text x="595" y="657" text-anchor="middle" fill="#94a3b8" font-size="9">公式 (API Key)</text>

<rect x="680" y="620" width="130" height="45" rx="8" fill="#27181a" stroke="#f97316"/>
<text x="745" y="643" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">AWS MCP</text>
<text x="745" y="657" text-anchor="middle" fill="#94a3b8" font-size="9">公式 (IAM)</text>

<!-- Bedrock Model -->
<rect x="830" y="484" width="200" height="45" rx="8" fill="#1a2332" stroke="#3b82f6"/>
<text x="930" y="507" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Bedrock Model</text>
<text x="930" y="521" text-anchor="middle" fill="#94a3b8" font-size="9">claude-haiku-4.5 等</text>

<!-- ========== Arrows ========== -->

<!-- 1. User → Lambda -->
<path d="M 90 60 L 90 98" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<text x="98" y="82" fill="#94a3b8" font-size="9">Slack Events API</text>

<!-- 2. Lambda → Runtime (via VPCE) -->
<path d="M 230 130 L 378 130" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#a-cyan)"/>
<text x="260" y="122" fill="#22d3ee" font-size="9">InvokeAgentRuntime</text>
<text x="260" y="146" fill="#64748b" font-size="8">VPC Endpoint 経由 (private)</text>

<!-- 3. Lambda ENI → VPCE bedrock-agentcore (down) -->
<path d="M 130 302 L 130 328" stroke="#22d3ee" stroke-width="1.2" fill="none" marker-end="url(#a-cyan)" opacity="0.5"/>

<!-- 4. Runtime → Memory -->
<path d="M 660 110 L 778 55" stroke="#4ade80" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<text x="690" y="72" fill="#4ade80" font-size="9">Memory API (VPCE)</text>

<!-- 5. Runtime → Gateway (via VPCE) -->
<path d="M 520 170 L 520 200 L 165 200 L 165 378" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)" opacity="0.6"/>
<path d="M 165 418 L 165 490 L 418 530" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)" opacity="0.6"/>
<text x="180" y="490" fill="#22d3ee" font-size="8">MCP Gateway via VPCE</text>

<!-- 6. VPC Peering → Product VPC -->
<path d="M 740 370 L 828 362" stroke="#a3e635" stroke-width="1.8" fill="none" marker-end="url(#a-lime)"/>

<!-- 7. Gateway → MCP targets -->
<path d="M 445 565 L 445 618" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
<path d="M 580 565 L 595 618" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
<path d="M 700 565 L 745 618" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

<!-- 8. Runtime → Bedrock Model (NAT) -->
<path d="M 660 145 L 700 145 L 700 506 L 828 506" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#a-gray)"/>
<text x="710" y="500" fill="#64748b" font-size="8">NAT GW → Internet</text>

<!-- 9. Internet → Runtime DENIED -->
<path d="M 780 135 L 662 135" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#a-red)"/>
<text x="690" y="128" fill="#f87171" font-size="10" font-weight="700">DENIED</text>

<!-- ========== Legend ========== -->
<rect x="20" y="700" width="1060" height="40" rx="6" fill="#1e293b" opacity="0.5"/>
<line x1="40"  y1="720" x2="68"  y2="720" stroke="#22d3ee" stroke-width="2"/>
<text x="74" y="724" fill="#94a3b8" font-size="10">VPC Endpoint (private)</text>
<line x1="230" y1="720" x2="258" y2="720" stroke="#4ade80" stroke-width="2"/>
<text x="264" y="724" fill="#94a3b8" font-size="10">AWS API</text>
<line x1="340" y1="720" x2="368" y2="720" stroke="#a3e635" stroke-width="2"/>
<text x="374" y="724" fill="#94a3b8" font-size="10">VPC Peering</text>
<line x1="470" y1="720" x2="498" y2="720" stroke="#fb923c" stroke-width="2"/>
<text x="504" y="724" fill="#94a3b8" font-size="10">Gateway → Target</text>
<line x1="640" y1="720" x2="668" y2="720" stroke="#64748b" stroke-width="2"/>
<text x="674" y="724" fill="#94a3b8" font-size="10">NAT GW (Internet)</text>
<line x1="810" y1="720" x2="838" y2="720" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4"/>
<text x="844" y="724" fill="#94a3b8" font-size="10">Denied</text>

</svg>
</body>
</html>
